# Scraping su GitHub, invio Telegram tramite PythonAnywhere e il secret esistente.
# L'indirizzo con il segreto sta nel secret CRON_URL del repository, mai nel codice.
name: cron
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 6 1 * *" # una volta al mese: commit di mantenimento (GitHub sospende i cron dopo 60 giorni senza attività)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tick:
    if: github.event.schedule != '0 6 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m valuebot.job
        env:
          CRON_URL: ${{ secrets.CRON_URL }}

  keepalive:
    if: github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%d > .github/keepalive
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive" && git push || true
