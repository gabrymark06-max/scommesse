name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Verifica scraping reale senza invii Telegram
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          from valuebot.job import collect
          predictions, report = collect()
          print(report)
          print('Pronostici pronti:', len(predictions))
          if report['errors']:
              raise SystemExit('Scraping incompleto')
          PY
